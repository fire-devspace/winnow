<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$ — Winnow$else$Winnow$endif$</title>
$if(description)$<meta name="description" content="$description$">$endif$
$if(url)$<link rel="canonical" href="$url$">
<meta property="og:type" content="article">
<meta property="og:url" content="$url$">$endif$
$if(title)$<meta property="og:title" content="$title$ — Winnow">
<meta name="twitter:title" content="$title$ — Winnow">$endif$
$if(description)$<meta property="og:description" content="$description$">
<meta name="twitter:description" content="$description$">$endif$
$if(url)$<meta property="og:image" content="https://winnowwallet.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://winnowwallet.com/og.png">$endif$
<style>
  :root { color-scheme:light dark;--bg:#fcfbf9;--fg:#17140f;--dim:#625e54;--acc:#b35f05;--card:#f4f1ea;--line:#ded9cc; }
  @media(prefers-color-scheme:dark){:root{--bg:#0b0d10;--fg:#e8e6e3;--dim:#aaa497;--acc:#f5a94b;--card:#14171c;--line:#302b20}}
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif; font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased; }
  main { max-width:48rem; margin:0 auto; padding:3rem 1.25rem 5rem; }
  h1, h2, h3 { line-height:1.25; margin:2rem 0 .6rem; letter-spacing:-.01em; }
  h1 { font-size:1.7rem; margin-top:0; }
  h2 { font-size:1.25rem; border-top:1px solid var(--line); padding-top:1.4rem; }
  h3 { font-size:1.05rem; }
  p, li { color:var(--dim); }
  p { margin:.6rem 0; }
  ul, ol { padding-left:1.3rem; }
  li { margin:.3rem 0; }
  strong { color:var(--fg); font-weight:600; }
  em { color:var(--fg); }
  code { background:var(--card); border:1px solid var(--line); border-radius:.3rem; padding:.05em .35em; font-size:.88em; color:var(--fg); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:.5rem; padding:.8rem 1rem; overflow-x:auto; margin:.8rem 0; }
  pre code { background:none; border:0; padding:0; }
  a { color:var(--acc); }
  hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
  table { border-collapse:collapse; width:100%; font-size:.88rem; margin:1rem 0; }
  th, td { border:1px solid var(--line); padding:.4rem .55rem; text-align:left; vertical-align:top; }
  th { color:var(--fg); background:var(--card); }
  td { color:var(--dim); }
  blockquote { border-left:3px solid var(--acc); padding-left:1rem; margin:1rem 0; }
  nav.home { margin-bottom:1.5rem; font-size:.9rem; display:flex;gap:1rem;flex-wrap:wrap; }
  :focus-visible{outline:2px solid #f7931a;outline-offset:3px}
</style>
</head>
<body>
<main>
<nav class="home"><a href="/">← Winnow</a><a href="/present">Presentation</a><a href="/architecture">Architecture</a><a href="/paper">Canonical paper</a></nav>
$body$
</main>
</body>
</html>
