name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check CI selection rules
        run: python3 -m unittest discover -s scripts/tests -p test_ci_required.py
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-required ci

  complexity:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cyclomatic complexity budget
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint --quiet
      - name: No silently skipped tests
        run: scripts/check-test-gates

  package-tests-intel:
    needs: changes
    # The persistent Intel seat takes branches of this repository; forks stay hosted.
    if: needs.changes.outputs.required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos, x86_64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Swift package tests on x86_64
        run: swift test

  package:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Package and debugging tool tests
        run: |
          scripts/check-dependencies
          swift test
          scripts/ci-debug

      - name: Release-build production package and reject first-party warnings
        run: >-
          scripts/ci-production-warnings
          "$RUNNER_TEMP/winnow-production-build"
          "$RUNNER_TEMP/winnow-production-build.log"

      - name: Exercise release debugging commands
        run: |
          "$RUNNER_TEMP/winnow-production-build/release/winnow-debug" inspect --help
          "$RUNNER_TEMP/winnow-production-build/release/winnow-debug" generate --help
          "$RUNNER_TEMP/winnow-production-build/release/winnow-debug" soak --help

      - name: Generate deterministic SBOM and build provenance
        run: |
          scripts/generate-supply-chain-metadata \
            --output-dir "$RUNNER_TEMP/supply-chain" \
            --subject "$RUNNER_TEMP/winnow-production-build/release/winnow-debug" \
            --subject-name winnow-debug \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.workflow_sha }}"
          scripts/generate-supply-chain-metadata \
            --output-dir "$RUNNER_TEMP/supply-chain-replay" \
            --subject "$RUNNER_TEMP/winnow-production-build/release/winnow-debug" \
            --subject-name winnow-debug \
            --builder-id "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.workflow_sha }}"
          diff -ru "$RUNNER_TEMP/supply-chain" "$RUNNER_TEMP/supply-chain-replay"

      - name: Upload build log, SBOM, and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-supply-chain-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/winnow-production-build.log
            ${{ runner.temp }}/supply-chain/
          if-no-files-found: warn
          retention-days: 14

      # The development harness exercises the local Bitcoin modules.
      # Deliberately a FIXED seed, unlike the sustained lane. This is the
      # regression evidence: every pull request fuzzes the identical 9,000
      # cases, so a newly-introduced parser bug shows up as this job turning
      # red rather than as a corpus that happened to wander somewhere new.
      # Rotation belongs in the scheduled lane; do not "fix" this one too.
      - name: Bounded deterministic fuzz smoke
        run: |
          mkdir -p "$RUNNER_TEMP/winnow-fuzz-smoke"
          set -o pipefail
          swift run --scratch-path "$RUNNER_TEMP/winnow-production-build" \
            --configuration release WinnowFuzz \
            --iterations 1000 \
            --seed 0x57494e4e4f575055 \
            --max-input 16384 \
            --artifact-dir "$RUNNER_TEMP/winnow-fuzz-smoke" \
            2>&1 | tee "$RUNNER_TEMP/winnow-fuzz-smoke/run.log"

      - name: Upload fuzz log and reproducer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/winnow-fuzz-smoke/
          if-no-files-found: warn
          retention-days: 7

  app-build:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: App unit tests (required)
        run: scripts/ci-app-tests "$RUNNER_TEMP/app-tests"
      - name: Verify resolved dependencies
        run: scripts/check-dependencies --xcode "$RUNNER_TEMP/app-tests/DerivedData"
      - name: Build and inspect release app
        run: |
          set -o pipefail
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/winnow-release" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/winnow-release-build.log"
          scripts/check-dependencies --xcode "$RUNNER_TEMP/winnow-release"
          scripts/check-swift-warnings "$RUNNER_TEMP/winnow-release-build.log"
          scripts/verify-release-e2e-exclusion \
            "$RUNNER_TEMP/winnow-release/Build/Products/Release-iphonesimulator/WinnowApp.app"
      - name: Upload app results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-tests-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/app-tests/app-tests.log
            ${{ runner.temp }}/app-tests/AppTests.xcresult
            ${{ runner.temp }}/winnow-release-build.log
          if-no-files-found: error
          retention-days: 14
