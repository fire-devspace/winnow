name: CI

# Webpage-only changes skip this workflow. They run Site instead:
# .github/workflows/site.yml — checkout + Cloudflare Pages, no Swift/Xcode.
#
# This cannot be a blanket "docs/**". project.yml bundles six files from docs/
# into the app as resources — site.css and the five design papers — so editing
# or renaming one of those has to build. They are deliberately absent below.
# Keep this list in step with the resources block in project.yml.
#
# A deny list fails safe: a page added later is not listed, so it runs CI
# (slow but correct) rather than silently skipping it.
on:
  push:
    branches: [main]
    paths-ignore: &site-only
      - "docs/index.html"
      - "docs/present.html"
      - "docs/architecture.html"
      - "docs/papers.html"
      - "docs/custody.html"
      - "docs/evidence.html"
      - "docs/privacy.html"
      - "docs/paper.md"
      - ".github/internal/**"
      - "docs/screenshots/**"
      - "docs/og.png"
      - "docs/present-qr.png"
      - ".github/workflows/site.yml"
      - ".github/agent-handoff.md"
  pull_request:
    paths-ignore: *site-only

jobs:
  package-tests:
    runs-on: [self-hosted, macos, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests (176+ BIP vector + unit + loopback)
        run: swift test
        # Env-gated suites (DifferentialTests, signet integration) skip
        # cleanly without WINNOW_DIFF/WINNOW_SIGNET and no local node.

  app-build:
    # GitHub-hosted: the self-hosted VMs are CLT-only for now (no Xcode.app).
    # Move back to [self-hosted, macos, x86_64] once the VMs have full Xcode.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen
      - name: Build app (iOS Simulator)
        run: >-
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation -skipMacroValidation build
      - name: Build and inspect release app
        run: |
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/winnow-release" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build
          scripts/verify-release-e2e-exclusion \
            "$RUNNER_TEMP/winnow-release/Build/Products/Release-iphonesimulator/WinnowApp.app"
