name: CI

# Webpage-only changes skip this workflow. They run Site instead:
# .github/workflows/site.yml — checkout + Cloudflare Pages, no Swift/Xcode.
#
# This cannot be a blanket "docs/**". project.yml bundles six files from docs/
# into the app as resources — site.css and the five design papers — so editing
# or renaming one of those has to build. They are deliberately absent below.
# Keep this list in step with the resources block in project.yml.
#
# A deny list fails safe: a page added later is not listed, so it runs CI
# (slow but correct) rather than silently skipping it.
on:
  # Manual re-runs after dropped push events (e.g. an Actions outage
  # swallowing the push that added a job).
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &site-only
      - "docs/index.html"
      - "docs/present.html"
      - "docs/architecture.html"
      - "docs/papers.html"
      - "docs/custody.html"
      - "docs/evidence.html"
      - "docs/privacy.html"
      - "docs/paper.md"
      - ".github/internal/**"
      - "docs/screenshots/**"
      - "docs/og.png"
      - "docs/present-qr.png"
      - ".github/workflows/site.yml"
      - ".github/workflows/appstore-submit.yml"
      - ".github/agent-handoff.md"
      - "docs/appstore-whats-new.txt"
      - "docs/testflight-what-to-test.txt"
  pull_request:
    paths-ignore: *site-only

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The complexity budget from .swiftlint.yml, enforced: SwiftLint exits
  # nonzero on error-level violations (over 8 decision paths) and green on
  # warnings — the single 8 slot is the ratchet's remaining headroom. As of
  # the third pay-down every function in Sources/ is at 7 or under.
  complexity:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Cyclomatic complexity budget
        run: |
          which swiftlint || brew install swiftlint
          swiftlint lint --quiet

  # The package suites moved with the library to winnowwallet/btc-swift;
  # this repo's CI covers what lives here: the app and its budget.
  app-build:
    # GitHub-hosted: the self-hosted VMs are CLT-only for now (no Xcode.app).
    # Move back to [self-hosted, macos, x86_64] once the VMs have full Xcode.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: Build app (iOS Simulator)
        run: >-
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation -skipMacroValidation build
      - name: App unit tests (required)
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            json = JSON.parse(STDIN.read)
            runtimes = json.fetch("devices").keys.grep(/\.iOS-/).sort.reverse
            device = runtimes.lazy.flat_map { |runtime| json["devices"][runtime] }
              .find { |entry| entry["isAvailable"] && entry["name"].start_with?("iPhone") }
            abort "no available iPhone simulator" unless device
            puts device.fetch("udid")
          ')"
          test -n "$SIMULATOR_ID"
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:WinnowAppTests \
            -skipPackagePluginValidation -skipMacroValidation
      - name: Build and inspect release app
        run: |
          set -o pipefail
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/winnow-release" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee "$RUNNER_TEMP/winnow-release-build.log"
          # The library runs the same gate over its own sources; this covers
          # what lives here. Reads the build above rather than repeating it.
          scripts/ci-app-warnings "$RUNNER_TEMP/winnow-release-build.log"
          scripts/verify-release-e2e-exclusion \
            "$RUNNER_TEMP/winnow-release/Build/Products/Release-iphonesimulator/WinnowApp.app"
