name: Node integration

# One disposable custom signet per run on the self-hosted seat. The Core
# differential leg gates pull requests from branches in this repository and
# runs on every push to main; the simulator UI leg runs nightly, on release,
# and on confirmed manual dispatch. Forks never reach the seat. Mining suites
# stay serial: one listener per VM, one job at a time.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      confirm_dedicated_fixture:
        description: Run differential and UI suites on the disposable node fixture
        required: true
        type: boolean
        default: false
      capture_storefront:
        description: Also capture the App Store screenshot set after the UI suite (adds ~20 min)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      confirm_dedicated_fixture:
        required: true
        type: boolean
      capture_storefront:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Per ref, like CI: a pull request never queues behind another ref's nightly.
# The single listener on the VM is what serializes jobs on the seat.
concurrency:
  group: node-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WINNOW_NODE_HOST: '127.0.0.1'
  WINNOW_P2P_PORT: '38601'
  WINNOW_RPC_PORT: '38600'

jobs:
  # A job skipped by `if:` reports success, so a docs-only change passes
  # without touching the seat; a workflow-level paths filter would instead
  # leave a required check at "Expected" forever.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$EVENT" in
            pull_request|push) ;;
            *) echo "node=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [[ -z "$BASE" ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "node=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(Sources/|Tests/|UITests/|AppTests/|Package\.(swift|resolved)$|project\.yml$|scripts/(signet-fixture|ios-simulator|install-xcodegen)$|\.github/workflows/node-tests\.yml$)'; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  differential:
    needs: changes
    if: >-
      needs.changes.outputs.node == 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (contains('pull_request push schedule', github.event_name) || inputs.confirm_dedicated_fixture)
    runs-on: [self-hosted, macOS, btc-swift, node-e2e]
    # First measured run under this lane: 5 m 20 s (run 34056640602).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Sweep a fixture left by an interrupted run
        run: |
          pkill -f 'bitcoind -datadir=.*/winnow-signet-' || true
          echo "WINNOW_DATADIR=$RUNNER_TEMP/winnow-signet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start this run's isolated fixture
        run: |
          command -v bitcoind
          command -v bitcoin-cli
          command -v bitcoin-util
          test ! -e "$WINNOW_DATADIR"
          for port in "$WINNOW_RPC_PORT" "$WINNOW_P2P_PORT"; do
            if nc -z -G 1 "$WINNOW_NODE_HOST" "$port"; then
              echo "::error::fixture port $port is already occupied"
              exit 1
            fi
          done
          scripts/signet-fixture up
          bitcoin-cli -datadir="$WINNOW_DATADIR" -rpcport="$WINNOW_RPC_PORT" getblockchaininfo \
            | python3 -c 'import json,sys; info=json.load(sys.stdin); assert info["chain"] == "signet" and info["blocks"] == 0, "expected a fresh signet fixture"'

      # The build lives in the checkout's .build, which the runner keeps
      # between jobs; a scratch path under RUNNER_TEMP is wiped every run.
      - name: Differential tests
        env:
          WINNOW_DIFF: '1'
        run: |
          set -o pipefail
          swift test --filter DifferentialTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/differential.log"

      - name: Stop this run's fixture
        if: always()
        run: |
          if [[ -n "${WINNOW_DATADIR:-}" && -f "$WINNOW_DATADIR/bitcoin.conf" ]]; then
            scripts/signet-fixture down
          fi

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-differential-${{ github.run_id }}
          path: ${{ runner.temp }}/differential.log
          if-no-files-found: error
          retention-days: 14

  ui:
    needs: changes
    if: >-
      github.event_name == 'schedule'
      || (inputs.confirm_dedicated_fixture && github.event_name != 'pull_request' && github.event_name != 'pull_request_target')
    runs-on: [self-hosted, macOS, btc-swift, node-e2e]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stop simulator miners and fixtures left by an interrupted run
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          pkill -f 'bitcoind -datadir=.*/winnow-signet-' || true
          echo "WINNOW_DATADIR=$RUNNER_TEMP/winnow-signet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start this run's isolated fixture
        run: |
          test -d /Applications/Xcode.app/Contents/Developer
          command -v bitcoind
          command -v bitcoin-cli
          command -v bitcoin-util
          test ! -e "$WINNOW_DATADIR"
          for port in "$WINNOW_RPC_PORT" "$WINNOW_P2P_PORT"; do
            if nc -z -G 1 "$WINNOW_NODE_HOST" "$port"; then
              echo "::error::fixture port $port is already occupied"
              exit 1
            fi
          done
          scripts/signet-fixture up
          bitcoin-cli -datadir="$WINNOW_DATADIR" -rpcport="$WINNOW_RPC_PORT" getblockchaininfo \
            | python3 -c 'import json,sys; info=json.load(sys.stdin); assert info["chain"] == "signet" and info["blocks"] == 0, "expected a fresh signet fixture"'

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen

      - name: Generate project and simulator configuration
        run: |
          xcodegen
          echo "SIMULATOR_ID=$(scripts/ios-simulator)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/node-screenshots"
          {
            echo "WINNOW_NODE_HOST=$WINNOW_NODE_HOST"
            echo "WINNOW_P2P_PORT=$WINNOW_P2P_PORT"
            echo "WINNOW_RPC_PORT=$WINNOW_RPC_PORT"
            echo "WINNOW_DATADIR=$WINNOW_DATADIR"
            echo "WINNOW_SCREENSHOT_DIR=$RUNNER_TEMP/node-screenshots"
          } > "$HOME/.winnow-node.env"

      # The storefront capture class is excluded here so it is never a
      # silent skip; the step below runs it on request.
      - name: App UI tests
        run: |
          set -o pipefail
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/winnow-node-app" \
            -resultBundlePath "$RUNNER_TEMP/NodeUI.xcresult" \
            -only-testing:WinnowAppUITests \
            -skip-testing:WinnowAppUITests/StorefrontCaptureTests \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee "$RUNNER_TEMP/node-ui.log"

      - name: App Store screenshot capture
        if: inputs.capture_storefront
        run: |
          set -o pipefail
          WINNOW_DERIVED_DATA="$RUNNER_TEMP/winnow-node-app" scripts/storefront-capture \
            2>&1 | tee "$RUNNER_TEMP/storefront.log"

      - name: Stop simulator miners and remove test configuration
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          rm -f "$HOME/.winnow-node.env"

      - name: Stop this run's fixture
        if: always()
        run: |
          if [[ -n "${WINNOW_DATADIR:-}" && -f "$WINNOW_DATADIR/bitcoin.conf" ]]; then
            scripts/signet-fixture down
          fi

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/node-ui.log
            ${{ runner.temp }}/storefront.log
            ${{ runner.temp }}/NodeUI.xcresult
            ${{ runner.temp }}/node-screenshots/
          if-no-files-found: error
          retention-days: 14
