name: Node integration

# Fresh fixture per run: trusted callers only, mining suites serial.
on:
  workflow_dispatch:
    inputs:
      confirm_dedicated_fixture:
        description: Run differential and UI suites on the disposable node fixture
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      confirm_dedicated_fixture:
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: node-tests
  cancel-in-progress: false

jobs:
  node-tests:
    if: inputs.confirm_dedicated_fixture && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: [self-hosted, macOS, btc-swift, node-e2e]
    timeout-minutes: 120
    env:
      WINNOW_NODE_HOST: '127.0.0.1'
      WINNOW_P2P_PORT: '38601'
      WINNOW_RPC_PORT: '38600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stop simulator miners left by an interrupted run
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          echo "WINNOW_DATADIR=$RUNNER_TEMP/winnow-signet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Start this run's isolated fixture
        run: |
          test -d /Applications/Xcode.app/Contents/Developer
          command -v bitcoind
          command -v bitcoin-cli
          command -v bitcoin-util
          test ! -e "$WINNOW_DATADIR"
          for port in "$WINNOW_RPC_PORT" "$WINNOW_P2P_PORT"; do
            if nc -z -G 1 "$WINNOW_NODE_HOST" "$port"; then
              echo "::error::fixture port $port is already occupied"
              exit 1
            fi
          done
          scripts/signet-fixture up
          bitcoin-cli -datadir="$WINNOW_DATADIR" -rpcport="$WINNOW_RPC_PORT" getblockchaininfo \
            | python3 -c 'import json,sys; info=json.load(sys.stdin); assert info["chain"] == "signet" and info["blocks"] == 0, "expected a fresh signet fixture"'

      - name: Differential tests
        env:
          WINNOW_DIFF: '1'
        run: |
          set -o pipefail
          swift test --scratch-path "$RUNNER_TEMP/winnow-node-build" \
            --filter DifferentialTests --no-parallel \
            2>&1 | tee "$RUNNER_TEMP/differential.log"

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen

      - name: Generate project and simulator configuration
        run: |
          xcodegen
          echo "SIMULATOR_ID=$(scripts/ios-simulator)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/node-screenshots"
          {
            echo "WINNOW_NODE_HOST=$WINNOW_NODE_HOST"
            echo "WINNOW_P2P_PORT=$WINNOW_P2P_PORT"
            echo "WINNOW_RPC_PORT=$WINNOW_RPC_PORT"
            echo "WINNOW_DATADIR=$WINNOW_DATADIR"
            echo "WINNOW_SCREENSHOT_DIR=$RUNNER_TEMP/node-screenshots"
          } > "$HOME/.winnow-node.env"

      - name: App UI tests
        run: |
          set -o pipefail
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/winnow-node-app" \
            -resultBundlePath "$RUNNER_TEMP/NodeUI.xcresult" \
            -only-testing:WinnowAppUITests \
            -skipPackagePluginValidation -skipMacroValidation \
            2>&1 | tee "$RUNNER_TEMP/node-ui.log"

      - name: Stop simulator miners and remove test configuration
        if: always()
        run: |
          xcrun simctl shutdown all || true
          pkill -f WinnowAppUITests-Runner || true
          rm -f "$HOME/.winnow-node.env"

      - name: Stop this run's fixture
        if: always()
        run: |
          if [[ -n "${WINNOW_DATADIR:-}" && -f "$WINNOW_DATADIR/bitcoin.conf" ]]; then
            scripts/signet-fixture down
          fi

      - name: Upload node integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-integration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/differential.log
            ${{ runner.temp }}/node-ui.log
            ${{ runner.temp }}/NodeUI.xcresult
            ${{ runner.temp }}/node-screenshots/
          if-no-files-found: error
          retention-days: 14
