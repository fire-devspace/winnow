name: Site

# Deploys docs/ to Cloudflare Pages. No build step — docs/ is hand-written HTML.
#   push to main / workflow_dispatch → production (winnowwallet.com)
#   pull request                     → per-PR preview, never the live domain
# Requires repo secrets: CF_API_TOKEN (Account → Cloudflare Pages: Edit),
# CF_ACCOUNT_ID. Project name: winnow. Custom domain: winnowwallet.com.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/site.yml"]

permissions:
  contents: read

# A second push to the same PR supersedes the previous preview.
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: docs
      - name: Deploy docs/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy docs --project-name=winnow --branch=main

  preview:
    # Fork PRs cannot read CF_API_TOKEN; skip instead of failing opaquely.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: docs

      # Any --branch other than main is a Cloudflare preview: it never
      # touches the production domain.
      - name: Deploy preview to Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >-
            pages deploy docs --project-name=winnow
            --branch=pr-${{ github.event.pull_request.number }}
            --commit-dirty=true

      - name: Comment the preview URL (one sticky comment, updated in place)
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.cf.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- site-preview -->';
            // Derive the Pages apex from the deployment URL. The project
            // subdomain is winnow-avs, not winnow, so a guessed
            // "<pr>.winnow.pages.dev" 404s.
            const url = process.env.URL || '';
            const apex = (url.match(/^https:\/\/[^.]+\.(.+)$/) || [])[1] || 'winnow-avs.pages.dev';
            const alias = `https://pr-${process.env.PR}.${apex}`;
            const pages = ['/', '/architecture', '/present', '/paper.md', '/evidence', '/custody']
              .map(p => `[\`${p}\`](${alias}${p})`).join(' · ');
            const body = [
              marker,
              `### Site preview for \`${context.sha.slice(0, 7)}\``,
              '',
              `**Stable alias:** ${alias} — always the newest build of this PR.`,
              `**This build:** ${process.env.URL}`,
              '',
              pages,
              '',
              '_Preview only; the production domain is untouched until this merges._',
            ].join('\n');
            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number});
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
