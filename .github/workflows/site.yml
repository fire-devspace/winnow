name: Website

# docs/ is the single static website source; five papers and site.css are also
# bundled by project.yml. CI validates those app resources with the same tree.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/check-site', 'scripts/build-site', 'UITests/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['docs/**', 'scripts/check-site', 'scripts/build-site', 'UITests/**', '.github/workflows/site.yml']

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true
      - name: Validate generated journeys, local links and LFS images
        run: |
          python3 -m unittest discover -s scripts/tests -p test_build_site.py
          scripts/check-site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'website' || 'website-preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: true
      - name: Select production or preview
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo 'branch=main' >> "$GITHUB_OUTPUT"
          elif [[ -n "$PR_NUMBER" ]]; then
            echo "branch=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "branch=preview-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy the static website
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: '4.125.0'
          command: pages deploy docs --project-name=winnow --branch=${{ steps.target.outputs.branch }} --commit-dirty=true
      - name: Show website URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          printf 'Website (%s): [%s](%s)\n' "$DEPLOYMENT_BRANCH" "$DEPLOYMENT_URL" "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
