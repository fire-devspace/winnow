name: Site

# Deploys docs/ to Cloudflare Pages on every push to main.
# Requires repo secrets: CF_API_TOKEN (Account → Cloudflare Pages: Edit),
# CF_ACCOUNT_ID. Project name: winnow. Custom domain: winnowwallet.com.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render markdown pages to HTML (pandoc)
        run: |
          sudo apt-get install -y pandoc
          cd docs
          for f in *.md; do pandoc "$f" -s --template=_template.html -o "${f%.md}.html"; done
      - name: Deploy docs/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy docs --project-name=winnow --branch=main
