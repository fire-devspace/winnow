name: Release

# Releases are cut deliberately by pushing a version tag — never by merging
# to main. `git tag v0.2.0 && git push origin v0.2.0` runs the full pipeline:
# test → sign → archive → TestFlight upload → GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

env:
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/MARKETING_VERSION: \"0.1.0\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml

      - name: Full test suite (gate)
        run: swift test

      - name: Install signing identity
        run: Scripts/ci-sign.sh

      - name: Archive
        run: >-
          brew install xcodegen && xcodegen && xcodebuild -project BTCSwiftApp.xcodeproj -scheme BTCSwiftApp
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/BTCSwiftApp.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/btc-swift-signing/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          -skipPackagePluginValidation -skipMacroValidation archive

      - name: Upload to App Store Connect
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>destination</key>
          	<string>upload</string>
          	<key>signingStyle</key>
          	<string>automatic</string>
          	<key>teamID</key>
          	<string>2858MX5336</string>
          	<key>manageAppVersionAndBuildNumber</key>
          	<false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/BTCSwiftApp.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/btc-swift-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation

      - name: TestFlight groups (internal + external)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/btc-swift-signing/AuthKey.p8
        run: |
          chmod +x Scripts/testflight.sh
          Scripts/testflight.sh wait-processing
          Scripts/testflight.sh internal
          Scripts/testflight.sh external

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
