name: Release

# Releases are cut deliberately by pushing a version tag — never by merging
# to main. `git tag v0.2.0 && git push origin v0.2.0` runs the full pipeline:
# test → sign → archive → TestFlight upload → GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/MARKETING_VERSION: \"0.1.0\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/" project.yml
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml
          printf 'TESTFLIGHT_MARKETING_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'TESTFLIGHT_BUILD_NUMBER=%s\n' "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Fallback peers freshness gate
        # 161: freshness tracks releases rather than someone remembering.
        # The peer list lives in btc-swift now, so the app release cannot
        # regenerate it — instead it refuses to ship a stale one: if the
        # pinned release's FallbackPeersGenerated.swift was last touched
        # more than 30 days ago, publish a refreshed library release and
        # bump the app's exact version before tagging the app again.
        run: |
          LIBRARY_VERSION=$(ruby -ryaml -e 'puts YAML.load_file("project.yml").fetch("packages").fetch("btc-swift").fetch("exactVersion")')
          LIBRARY_TAG="v$LIBRARY_VERSION"
          echo "pinned btc-swift release: $LIBRARY_TAG"
          curl --fail --silent --show-error "https://api.github.com/repos/winnowwallet/btc-swift/releases/tags/$LIBRARY_TAG" \
            | python3 -c 'import json,sys; release=json.load(sys.stdin); sys.exit("library release must be published and stable" if release["draft"] or release["prerelease"] else 0)'
          LAST=$(curl --fail --silent --show-error "https://api.github.com/repos/winnowwallet/btc-swift/commits?path=Sources/BitcoinP2P/Protocol/FallbackPeersGenerated.swift&sha=$LIBRARY_TAG&per_page=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["commit"]["committer"]["date"])')
          echo "peer list last regenerated: $LAST"
          python3 - "$LAST" <<'PYCHECK'
          import datetime, sys
          last = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          age = (datetime.datetime.now(datetime.timezone.utc) - last).days
          print(f"peer list age: {age} days")
          if age > 30:
              raise SystemExit("fallback peers are stale: regenerate in btc-swift and bump the pin")
          PYCHECK

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen

      - name: Generate Xcode project
        run: xcodegen

      - name: App unit tests (gate)
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            json = JSON.parse(STDIN.read)
            runtimes = json.fetch("devices").keys.grep(/\.iOS-/).sort.reverse
            device = runtimes.lazy.flat_map { |runtime| json["devices"][runtime] }
              .find { |entry| entry["isAvailable"] && entry["name"].start_with?("iPhone") }
            abort "no available iPhone simulator" unless device
            puts device.fetch("udid")
          ')"
          test -n "$SIMULATOR_ID"
          xcodebuild test -project WinnowApp.xcodeproj -scheme WinnowApp \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -only-testing:WinnowAppTests \
            -skipPackagePluginValidation -skipMacroValidation

      - name: Prepare signing credentials
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: scripts/ci-sign.sh

      - name: Import the persistent development certificate
        # The archive step signs with automatic signing, and an ephemeral
        # runner has an empty keychain — so Xcode's -allowProvisioningUpdates
        # minted a fresh Development certificate every release, whose private
        # key died with the VM minutes later. Thirteen of those hit Apple's
        # certificate cap on 2026-08-25 and failed a release with "choose a
        # certificate to revoke". One persistent certificate lives in the repo
        # secrets instead; with it present, Xcode reuses rather than mints.
        env:
          DEV_CERT_P12: ${{ secrets.DEV_CERT_P12 }}
          DEV_CERT_P12_PASSWORD: ${{ secrets.DEV_CERT_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/winnow-ci.keychain-db"
          KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DEV_CERT_P12" | base64 -D > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KC"             -P "$DEV_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain
          security find-identity -p codesigning "$KC" | head -3

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: >-
          xcodebuild -project WinnowApp.xcodeproj -scheme WinnowApp
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/WinnowApp.xcarchive
          -allowProvisioningUpdates
          -authenticationKeyPath "${RUNNER_TEMP}/winnow-signing/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          -skipPackagePluginValidation -skipMacroValidation archive

      - name: Verify shipped archive excludes E2E controls
        run: >-
          scripts/verify-release-e2e-exclusion
          build/WinnowApp.xcarchive/Products/Applications/WinnowApp.app

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p build
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>destination</key>
          	<string>upload</string>
          	<key>signingStyle</key>
          	<string>automatic</string>
          	<key>teamID</key>
          	<string>2858MX5336</string>
          	<key>manageAppVersionAndBuildNumber</key>
          	<false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/WinnowApp.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/winnow-signing/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation -skipMacroValidation

      - name: TestFlight groups (internal + external)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/winnow-signing/AuthKey.p8
        run: |
          chmod +x scripts/testflight.sh
          scripts/testflight.sh wait-processing
          scripts/testflight.sh notes
          scripts/testflight.sh internal
          scripts/testflight.sh external

      - name: Generate SBOM and app build provenance
        run: >-
          scripts/generate-supply-chain-metadata
          --output-dir build/supply-chain
          --subject build/WinnowApp.xcarchive/Products/Applications/WinnowApp.app
          --subject-name WinnowApp.app
          --builder-id https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.workflow_sha }}

      - name: Upload supply-chain metadata for release publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-supply-chain-${{ github.run_id }}
          path: build/supply-chain/
          if-no-files-found: error
          retention-days: 30

      - name: Remove App Store Connect key
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/winnow-signing/AuthKey.p8"
          rmdir "${RUNNER_TEMP}/winnow-signing" 2>/dev/null || true

  github-release:
    needs: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download supply-chain metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-supply-chain-${{ github.run_id }}
          path: supply-chain

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            supply-chain/winnow.spdx.json
            supply-chain/winnow-build-provenance.json
