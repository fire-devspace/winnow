name: BTCSwiftApp
options:
  bundleIdPrefix: com.btcswift
  deploymentTarget:
    iOS: "17.0"

# The local SPM package at the repository root (Package.swift). The app links
# its four library products; the only runtime dependency remains P256K.
packages:
  btc-swift:
    path: .
  # Linked directly by the UI-test target (its copy of the signet miner signs
  # block challenges with P256K).
  swift-secp256k1:
    url: https://github.com/21-DOT-DEV/swift-secp256k1
    exactVersion: 0.23.2

targets:
  BTCSwiftApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BTCSwiftApp
      # Design papers, bundled so Settings can render them offline (the
      # esplora opt-in warning links the read-side paper).
      - path: docs/mobile.md
        buildPhase: resources
      - path: docs/read-side.md
        buildPhase: resources
      - path: docs/write-side.md
        buildPhase: resources
      - path: docs/vaults.md
        buildPhase: resources
      - path: docs/import.md
        buildPhase: resources
    dependencies:
      - package: btc-swift
        product: WalletCore
      - package: btc-swift
        product: BitcoinP2P
      - package: btc-swift
        product: BitcoinCore
      - package: btc-swift
        product: BlockchainBackend
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app
        PRODUCT_NAME: BTCSwiftApp
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: "2858MX5336" # ttt246 llc
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Winnow
        # Standard/exempt crypto only (CryptoKit, libsecp256k1) — no export
        # compliance prompt per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Sync-while-active by design: no UIBackgroundModes.
        CODE_SIGN_STYLE: Automatic

  # End-to-end UI tests (XCUITest): drive the app on the local custom-signet
  # node and capture screenshots of every major use case into
  # docs/screenshots/. Node access (bitcoin-cli mining/funding) happens from
  # the macOS test-runner process; UITests/ carries copies of the CLI runner
  # and the BIP325 signet miner from Tests/DifferentialTests.
  BTCSwiftAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: BTCSwiftApp
      - package: btc-swift
        product: BitcoinCore
      - package: btc-swift
        product: BitcoinP2P
      - package: btc-swift
        product: WalletCore
      - package: swift-secp256k1
        product: P256K
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.btcswift.app.uitests
        TEST_TARGET_NAME: BTCSwiftApp
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "2858MX5336" # ttt246 llc

schemes:
  BTCSwiftApp:
    build:
      targets:
        BTCSwiftApp: all
        BTCSwiftAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BTCSwiftAppUITests
